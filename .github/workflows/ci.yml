name: CI Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pytest & Quality Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            code/capacity_calculator/requirements.txt
            code/cost_tracker/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff
          if [ -f code/capacity_calculator/requirements.txt ]; then pip install -r code/capacity_calculator/requirements.txt; fi
          if [ -f code/cost_tracker/requirements.txt ]; then pip install -r code/cost_tracker/requirements.txt; fi

      - name: Run Ruff Lint
        run: ruff check .

      - name: Run Test Suite
        run: pytest -v
