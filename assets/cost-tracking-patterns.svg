<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 545" width="100%" height="auto" role="img" aria-label="LLM production cost tracking patterns: per request, per user, per team, and per product attribution">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    .title { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 22px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .subtitle { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 12px; fill: #475569; text-anchor: middle; }
    .card-label { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 15px; font-weight: 700; fill: #1e293b; }
    .card-desc { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 11px; fill: #475569; }
    .bullet { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 10px; fill: #475569; }
    .best-label { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 11px; font-weight: 700; fill: #1e293b; text-anchor: middle; }
    .best-text { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 10px; fill: #475569; text-anchor: middle; }
    .number { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 15px; font-weight: 700; }
    .inner { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 10px; fill: #475569; text-anchor: middle; }
    @media (prefers-color-scheme: dark) {
      .title { fill: #f1f5f9; }
      .subtitle { fill: #94a3b8; }
      .card-label { fill: #e2e8f0; }
      .card-desc { fill: #cbd5e1; }
      .bullet { fill: #cbd5e1; }
      .best-label { fill: #e2e8f0; }
      .best-text { fill: #cbd5e1; }
      .inner { fill: #cbd5e1; }
    }
  </style>

  <text x="550" y="32" class="title">LLM Cost Tracking Patterns</text>
  <text x="550" y="52" class="subtitle">4 attribution models to stop cloud bill surprises</text>

  <!-- Card 1: Per Request -->
  <rect x="40" y="75" width="240" height="470" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="2.5"/>
  <circle cx="64" cy="108" r="13" fill="#22c55e"/>
  <text x="64" y="113" class="number" fill="#fff" text-anchor="middle">1</text>
  <text x="88" y="113" class="card-label">Per Request</text>
  <text x="58" y="140" class="card-desc">Charge back every prompt and
    <tspan x="58" dy="15">completion by provider and model.</tspan>
  </text>

  <rect x="58" y="175" width="204" height="110" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <g transform="translate(58, 175)">
    <text x="102" y="25" class="inner" style="font-size:14px; font-weight:600; fill:#15803d">$0.0042</text>
    <text x="102" y="45" class="inner" style="font-size:10px">GPT-4o mini</text>
    <text x="102" y="65" class="inner" style="font-size:9px">prompt: 1.2k tokens</text>
    <text x="102" y="80" class="inner" style="font-size:9px">completion: 0.8k tokens</text>
  </g>

  <text x="58" y="313" class="bullet">• Granular, provider-native</text>
  <text x="58" y="328" class="bullet">• Maps to invoice line items</text>
  <text x="58" y="343" class="bullet">• Hard to group by feature</text>

  <rect x="58" y="420" width="204" height="100" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="160" y="442" class="best-label">Best for</text>
  <text x="160" y="462" class="best-text">Reconciling provider invoices</text>
  <text x="160" y="477" class="best-text">and spotting model drift</text>

  <!-- Card 2: Per User -->
  <rect x="300" y="75" width="240" height="470" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5"/>
  <circle cx="324" cy="108" r="13" fill="#3b82f6"/>
  <text x="324" y="113" class="number" fill="#fff" text-anchor="middle">2</text>
  <text x="348" y="113" class="card-label">Per User</text>
  <text x="318" y="140" class="card-desc">Track token spend per user_id
    <tspan x="318" dy="15">across all their sessions.</tspan>
  </text>

  <rect x="318" y="175" width="204" height="110" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <g transform="translate(318, 175)">
    <text x="102" y="25" class="inner" style="font-size:12px; font-weight:600; fill:#1d4ed8">User A</text>
    <text x="102" y="45" class="inner" style="font-size:10px">sessions: 47</text>
    <text x="102" y="62" class="inner" style="font-size:10px">requests: 1,240</text>
    <text x="102" y="85" class="inner" style="font-size:12px; font-weight:600; fill:#1d4ed8">$18.50 / month</text>
  </g>

  <text x="318" y="313" class="bullet">• Ties spend to usage limits</text>
  <text x="318" y="328" class="bullet">• Shows power users</text>
  <text x="318" y="343" class="bullet">• Needs identity context</text>

  <rect x="318" y="420" width="204" height="100" rx="8" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="420" y="442" class="best-label">Best for</text>
  <text x="420" y="462" class="best-text">Consumer and SaaS apps</text>
  <text x="420" y="477" class="best-text">with usage quotas and rate limits</text>

  <!-- Card 3: Per Team -->
  <rect x="560" y="75" width="240" height="470" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.5"/>
  <circle cx="584" cy="108" r="13" fill="#f59e0b"/>
  <text x="584" y="113" class="number" fill="#fff" text-anchor="middle">3</text>
  <text x="608" y="113" class="card-label">Per Team</text>
  <text x="578" y="140" class="card-desc">Attribute spend by org unit
    <tspan x="578" dy="15">or cost center label.</tspan>
  </text>

  <rect x="578" y="175" width="204" height="110" rx="8" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
  <g transform="translate(578, 175)">
    <rect x="25" y="20" width="154" height="20" rx="3" fill="#fbbf24" opacity="0.7"/>
    <text x="102" y="34" class="inner" style="font-size:10px; font-weight:600; fill:#92400e">team: Search AI</text>
    <rect x="25" y="47" width="110" height="20" rx="3" fill="#fbbf24" opacity="0.55"/>
    <text x="80" y="61" class="inner" style="font-size:10px; font-weight:600; fill:#92400e">team: Fraud</text>
    <rect x="25" y="75" width="130" height="20" rx="3" fill="#fbbf24" opacity="0.8"/>
    <text x="90" y="89" class="inner" style="font-size:10px; font-weight:600; fill:#92400e">team: Support</text>
  </g>

  <text x="578" y="313" class="bullet">• Aligns with FinOps</text>
  <text x="578" y="328" class="bullet">• Shows product ROI</text>
  <text x="578" y="343" class="bullet">• Requires label hygiene</text>

  <rect x="578" y="420" width="204" height="100" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
  <text x="680" y="442" class="best-label">Best for</text>
  <text x="680" y="462" class="best-text">Internal platform teams sharing</text>
  <text x="680" y="477" class="best-text">one LLM infrastructure bill</text>

  <!-- Card 4: Per Product -->
  <rect x="820" y="75" width="240" height="470" rx="14" fill="#fdf2f8" stroke="#ec4899" stroke-width="2.5"/>
  <circle cx="844" cy="108" r="13" fill="#ec4899"/>
  <text x="844" y="113" class="number" fill="#fff" text-anchor="middle">4</text>
  <text x="868" y="113" class="card-label">Per Product</text>
  <text x="838" y="140" class="card-desc">Roll up spend by product feature,
    <tspan x="838" dy="15">model, or release tag.</tspan>
  </text>

  <rect x="838" y="175" width="204" height="110" rx="8" fill="#fce7f3" stroke="#f9a8d4" stroke-width="1.5"/>
  <g transform="translate(838, 175)">
    <text x="102" y="25" class="inner" style="font-size:12px; font-weight:600; fill:#be185d">Virtual Analyst</text>
    <text x="102" y="45" class="inner" style="font-size:10px">feature: sql-agent</text>
    <text x="102" y="62" class="inner" style="font-size:10px">version: v2.3.1</text>
    <text x="102" y="85" class="inner" style="font-size:12px; font-weight:600; fill:#be185d">$4,120 / week</text>
  </g>

  <text x="838" y="313" class="bullet">• Links cost to features</text>
  <text x="838" y="328" class="bullet">• Drives margin decisions</text>
  <text x="838" y="343" class="bullet">• Hardest to instrument</text>

  <rect x="838" y="420" width="204" height="100" rx="8" fill="#fce7f3" stroke="#fbcfe8" stroke-width="1.5"/>
  <text x="940" y="442" class="best-label">Best for</text>
  <text x="940" y="462" class="best-text">Multi-product AI platforms</text>
  <text x="940" y="477" class="best-text">at scale like Airbnb</text>

  <text x="550" y="535" class="subtitle">Production systems combine all four: request → user → team → product.</text>
</svg>